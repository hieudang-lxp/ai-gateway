syntax = "proto3";

package lxpscan.v1;

option go_package = "lxp-scan-svc/gen/lxpscanpb;lxpscanpb";

// ScanService wraps the lxp-scan cross-repo analyzer (Rust) over gRPC. Each RPC
// mirrors one lxp-scan tool and returns typed, structured results (not text) so
// CI and other machine clients can consume them directly. The Rust library is
// called in-process via cgo.
service ScanService {
  rpc Impact(ImpactRequest) returns (ImpactResponse);
  rpc Context(ContextRequest) returns (ContextResponse);
  rpc Drift(DriftRequest) returns (DriftResponse);
  rpc Dupes(DupesRequest) returns (DupesResponse);
  rpc Clones(ClonesRequest) returns (ClonesResponse);
}

// ---- Requests ----
// `root` overrides the server's default workspace root; empty = use it.

message ImpactRequest {
  string symbol = 1;
  string from = 2;
  string root = 3;
}

message ContextRequest {
  string symbol = 1;
  string from = 2;
  uint32 sites = 3; // max usage excerpts (0 = tool default, 8)
  string root = 4;
}

message DriftRequest {
  string root = 1;
}

message DupesRequest {
  string root = 1;
}

message ClonesRequest {
  string symbol = 1;     // only clusters containing this declaration name
  uint32 min_tokens = 2; // 0 = tool default (10)
  bool same_file = 3;
  string root = 4;
}

// ---- Impact ----
message ImpactSite {
  string repo = 1;
  string file = 2;
  uint32 line = 3;
  string source = 4; // resolved import source
  uint32 refs = 5;
  uint32 jsx_uses = 6;
  repeated string jsx_props = 7;
  repeated uint32 jsx_lines = 8;
}
message ImpactResponse {
  repeated ImpactSite sites = 1;
}

// ---- Drift ----
message VersionCell {
  string version = 1;
  string source = 2; // "local" | "remote"
}
message DriftRow {
  string pkg = 1;                       // package name
  map<string, VersionCell> versions = 2; // keyed by repo name
  string level = 3;                     // "Same" | "Minor" | "Major"
}
message DriftResponse {
  repeated DriftRow rows = 1;
}

// ---- Dupes ----
message DeclSite {
  string repo = 1;
  string file = 2;
  uint32 line = 3;
}
message DupeGroup {
  string name = 1;
  repeated DeclSite sites = 2;
  uint32 repo_count = 3;
}
message DupesResponse {
  repeated DupeGroup groups = 1;
}

// ---- Clones ----
message CloneMember {
  string repo = 1;
  string file = 2;
  uint32 line = 3;
  string name = 4;
  bool exported = 5;
  string kind = 6; // "fn" | "const"
  string sig = 7;
}
message CloneCluster {
  repeated CloneMember members = 1;
  uint32 token_count = 2;
  string sig = 3;
  repeated string literals = 4;
  repeated string notes = 5;
}
message ClonesResponse {
  repeated CloneCluster clusters = 1;
  repeated string npm_only_packages = 2;
}

// ---- Context ----
message PropCount {
  string name = 1;
  uint32 count = 2;
}
message Definition {
  string repo = 1;
  string file = 2;
  uint32 line = 3;
  string excerpt = 4;
}
message UsageExcerpt {
  string repo = 1;
  string file = 2;
  uint32 line = 3;
  repeated string jsx_props = 4;
  string code = 5;
}
message SameNameGroup {
  string repo = 1;
  uint32 sites = 2;
  string from_hint = 3;
}
message ContextResponse {
  string symbol = 1;
  uint32 total_sites = 2;
  uint32 total_files = 3;
  uint32 total_repos = 4;
  repeated PropCount prop_counts = 5;
  Definition definition = 6; // absent when no declaration found
  repeated UsageExcerpt excerpts = 7;
  repeated SameNameGroup same_name = 8;
}
